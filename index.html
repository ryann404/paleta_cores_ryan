<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paleta de Cores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="fundo">
    
    <h1>Paleta de Cores</h1>
    <div id="telaPintura"></div>
    <h3></h3>
    <p>Clique em uma das cores abaixo para pintar a tela</p>
    <div id="paleta">
        <div id="pincelAzul" class="pincel" style="background: blue"></div>

        <div id="pincelVermelho" class="pincel" style="background: tomato"></div>
        
        <div id="pincelAmarelo" class="pincel" style="background: gold"></div>
        
        <div id="pincelAzulVerde" class="pincel" style="background: linear-gradient(45deg, #136dfc, #0ef960)"></div>
        
        <div id="pincelLaranjaAmarelo" class="pincel" style="background: linear-gradient(45deg, #ffb60b, #f9f50e)"></div>
        
        <div id="pincelVerdeLaranja" class="pincel" style="background: linear-gradient(45deg, #32fc13, #f99f0e)"></div>
        
        <div id="pincelVermelhoRoxo" class="pincel" style="background: linear-gradient(45deg, #fc1313, #7c0ef9)"></div>
        
        <div id="pincelVioletaRosa" class="pincel" style="background: linear-gradient(45deg, #7f00ff, #f90ee5)"></div>
        
        <div id="pincelMarromAmarelo" class="pincel" style="background: linear-gradient(45deg, #b56304, #f5f90e)"></div>

        
    </div>
    <h2>Cores para o fundo</h2>
    <div id="paleta">
        <div id="pincelAzulInvertido" class="pincel" style="background: blue"></div>

        <div id="pincelVermelhoInvertido" class="pincel" style="background: tomato"></div>
        
        <div id="pincelAmareloInvertido" class="pincel" style="background: gold"></div>
        
        <div id="pincelAzulVerdeInvertido" class="pincel" style="background: linear-gradient(45deg, #136dfc, #0ef960)"></div>
        
        <div id="pincelLaranjaAmareloInvertido" class="pincel" style="background: linear-gradient(45deg, #ffb60b, #f9f50e)"></div>
        
        <div id="pincelVerdeLaranjaInvertido" class="pincel" style="background: linear-gradient(45deg, #32fc13, #f99f0e)"></div>
        
        <div id="pincelVermelhoRoxoInvertido" class="pincel" style="background: linear-gradient(45deg, #fc1313, #7c0ef9)"></div>
        
        <div id="pincelVioletaRosaInvertido" class="pincel" style="background: linear-gradient(45deg, #7f00ff, #f90ee5)"></div>
        
        <div id="pincelMarromAmareloInvertido" class="pincel" style="background: linear-gradient(45deg, #b56304, #f5f90e)"></div>

        
    </div>
    <script src="script.js"></script>
</body>
</html>
